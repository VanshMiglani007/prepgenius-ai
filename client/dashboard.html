<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepGenius AI - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="navbar">
            <h1 class="logo">PrepGenius AI</h1>
            <div class="nav-user">
                <span id="userName"></span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </nav>
        <main class="main-content">
            <div class="welcome-card">
                <h2>Welcome back!</h2>
                <p>Your intelligent exam preparation planner. Organize subjects, manage topics, and optimize your study schedule.</p>
            </div>
            <div class="quick-actions">
                <div class="action-card">
                    <i class="fa-solid fa-book"></i>
                    <h3>Subjects</h3>
                    <p>Manage your subjects</p>
                </div>
                <div class="action-card">
                    <i class="fa-solid fa-list-check"></i>
                    <h3>Topics</h3>
                    <p>Organize topics per subject</p>
                </div>
                <div class="action-card">
                    <i class="fa-solid fa-calendar-days"></i>
                    <h3>Study Plan</h3>
                    <p>Generate your schedule</p>
                </div>
            </div>
        </main>
        <div class="footer">
            <p>PrepGenius AI — Intelligent Exam Preparation</p>
        </div>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
